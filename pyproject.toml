[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prom-solark"
version = "0.1.0"
description = "Prometheus exporter for near real-time Sol-Ark telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Blind Badger Studios" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "RUF", "FURB", "PYI", "LOG"]
